    <h1>Red Pepper Hummus</h1>

    <h2>Description</h2>
    <h3>Ingredients</h3>
    <ul>
        <li>1 16 ounce can chickpeas</li>
        <li>1/2 cup roasted red pepper</li>
        <li>1/4 cup aquafaba</li>
        <li>1 tbsp lemon juice</li>
        <li>1 clove garlic</li>
        <li>1/8 teaspoon cumin</li>
        <li>Salt to taste</li>
    </ul>
